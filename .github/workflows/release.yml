name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "~2.8"

      - name: Extract metadata from version.ts
        run: |
          APP_NAME=$(grep 'APP_NAME' src/version.ts | sed 's/.*"\(.*\)".*/\1/')
          CODE_VERSION=$(grep 'APP_VERSION' src/version.ts | sed 's/.*"\(.*\)".*/\1/')
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_NAME" != "v${CODE_VERSION}" ]; then
            echo "Error: tag $GITHUB_REF_NAME does not match version.ts (v${CODE_VERSION})"
            exit 1
          fi

      - name: Compile all platforms
        run: bash scripts/compile.sh --all

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            > release_notes.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.APP_NAME }}-linux-amd64
            dist/${{ env.APP_NAME }}-linux-arm64
            dist/${{ env.APP_NAME }}-macos-amd64
            dist/${{ env.APP_NAME }}-macos-arm64
            dist/${{ env.APP_NAME }}-windows-amd64.exe
          body_path: release_notes.txt
          fail_on_unmatched_files: true

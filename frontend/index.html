    <div id="app">
      <div id="sidebar">
        <div id="sidebar-header">
          <h1>Env Viewer</h1>
          <input
            id="search"
            type="text"
            placeholder="Search clients &amp; projects…"
            autocomplete="off"
            spellcheck="false"
          >
        </div>
        <div id="sidebar-tree"></div>
        <div id="sidebar-menu">
          <button
            class="menu-item"
            id="menu-shortcuts"
            aria-label="Keyboard shortcuts"
          >
            <svg class="menu-icon" fill="currentColor" aria-hidden="true">
              <use href="#icon-keyboard" />
            </svg>
            Shortcuts
          </button>
          <button
            class="menu-item"
            id="menu-theme"
            aria-label="Toggle theme"
          >
            <svg class="menu-icon" fill="currentColor" aria-hidden="true">
              <use href="#icon-theme" />
            </svg>
            <span id="theme-btn-label">Light mode</span>
          </button>
        </div>
        <div id="sidebar-version">v__APP_VERSION__</div>
      </div>

      <div id="main">
        <div id="main-header">
          <div style="flex: 1; min-width: 0">
            <div id="main-title">Select a project</div>
            <div id="main-subtitle"></div>
          </div>
          <button class="btn" id="mask-btn">Show Values</button>
          <button class="btn" id="refresh-btn">
            <span id="refresh-icon">↻</span> Refresh
          </button>
        </div>

        <div id="main-content">
          <div class="state-view">
            <div class="state-icon">📋</div>
            <div class="state-msg">Select a project from the sidebar</div>
          </div>
        </div>

        <div id="status-bar">
          <span id="s-count"></span>
          <span id="s-time"></span>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>
    <div
      id="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      hidden
    >
      <div id="modal-box">
        <div id="modal-header">
          <h2 id="modal-title"></h2>
          <button id="modal-close" aria-label="Close">
            <svg width="18" height="18" fill="currentColor" aria-hidden="true">
              <use href="#icon-x" />
            </svg>
          </button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
